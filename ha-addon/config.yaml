name: Cat Printer
version: "1.1.17"
slug: cat_printer
description: YHK classic Bluetooth thermal printer HTTP API
url: https://github.com/LordWunderfrog/CatPrinter
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
# Supervisor no longer accepts privileged: true — must be a capability list
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
usb: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Print HTTP API
options:
  printer_mac: "25:00:27:00:1B:D5"
  printer_port: 2
  api_port: 8080
  api_token: ""
  default_subreddit: "wunkus"
schema:
  printer_mac: str
  printer_port: int
  api_port: int
  api_token: password
  default_subreddit: str
# Rotating app log → /share/cat_printer/addon.log (Samba: \\home.lan\share\...)
map:
  - share:rw
